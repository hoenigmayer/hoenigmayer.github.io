<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - Helmut Hönigmayer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --paper:#fff; --hairline:1px solid #111; }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', sans-serif; font-weight: 300;
    min-height: 100vh;
  }

  /* This page loads inside the index.html stage iframe:
     masthead, navigation and footer live in the parent document. */

  section { padding: 3rem 2rem; max-width: 760px; margin: 0 auto; }

  h1 {
    font-family:'Cormorant Garamond', serif; font-weight:400;
    font-size: clamp(2rem, 5vw, 3rem); letter-spacing:.12em;
    text-align:center; margin-bottom: 1.5rem;
  }
  .sub {
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:1.05rem; text-align:center; color:#444; margin-bottom: 2.5rem;
  }

  .post { list-style:none; }
  .post li {
    padding: 1.2rem 0; border-bottom: 1px solid #e5e5e5;
  }
  .post li:last-child { border-bottom:none; }

  .post .date {
    display:block; font-size:.65rem; letter-spacing:.3em;
    text-transform:uppercase; color:#555; margin-bottom:.35rem;
  }
  .post a {
    font-family:'Cormorant Garamond', serif; font-size:1.25rem;
    color:var(--ink); text-decoration:none;
  }
  .post a:hover { text-decoration:underline; }

  .empty {
    text-align:center; font-family:'Cormorant Garamond', serif;
    font-style:italic; font-size:1.1rem; color:#555;
    padding: 3rem 0;
  }
</style>
</head>
<body>

  <section>
    <h1>Blog</h1>
    <div class="sub">Notes on ethics, policy and responsible research</div>

    <!-- Upcoming posts go into this list:
    <ul class="post">
      <li>
        <span class="date">2027</span>
        <a href="#">Post title</a>
      </li>
    </ul>
    -->

    <p class="empty">Upcoming</p>
  </section>

</body>
</html>
